name: watch-ccgavn

# Machine-independent watchdog for the CC-GAVN runs (seed 0 on vedangpandeyyy,
# seed 1 on shoumikmitra). Polls Kaggle every 20 minutes; re-pushes notebook 07
# (resuming from the latest HF checkpoint) whenever a session has ended before
# step 160000. Becomes a no-op once all runs have uploaded checkpoint-160000.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: watch-ccgavn
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet "kaggle>=2,<3" huggingface_hub numpy
      - name: Write Kaggle credentials
        env:
          KAGGLE_JSON_VEDANGPANDEYY: ${{ secrets.KAGGLE_JSON_VEDANGPANDEYY }}
          KAGGLE_ACCESS_TOKEN_SHOUMIKMITRA: ${{ secrets.KAGGLE_ACCESS_TOKEN_SHOUMIKMITRA }}
        run: |
          mkdir -p "$HOME/.kaggle/profiles/shoumikmitra"
          printf '%s' "$KAGGLE_JSON_VEDANGPANDEYY" > "$HOME/.kaggle/kaggle.json"
          printf '%s' "$KAGGLE_ACCESS_TOKEN_SHOUMIKMITRA" > "$HOME/.kaggle/profiles/shoumikmitra/access_token"
          chmod 600 "$HOME/.kaggle/kaggle.json" "$HOME/.kaggle/profiles/shoumikmitra/access_token"
      - name: One watcher pass
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
        run: python3 scripts/watch_ccgavn.py --once
