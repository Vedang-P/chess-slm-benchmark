name: pipeline-tick

# The single 24/7 supervisor for the whole project. Triggered every ~10 min by
# the Cloudflare Worker cron (repository_dispatch "tick"), with a 30-minute
# cron as a fallback. Runs the keep-alive checks and pushes the monitor
# snapshot. No local machine is involved.

on:
  repository_dispatch:
    types: [tick]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pipeline-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet "kaggle>=2,<3" huggingface_hub numpy python-chess
      - name: Write Kaggle credentials
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
          KAGGLE_JSON_VEDANGPANDEYY: ${{ secrets.KAGGLE_JSON_VEDANGPANDEYY }}
          KAGGLE_ACCESS_TOKEN_SOFTMAXSIMP: ${{ secrets.KAGGLE_ACCESS_TOKEN_SOFTMAXSIMP }}
          KAGGLE_ACCESS_TOKEN_SAMALTMANN: ${{ secrets.KAGGLE_ACCESS_TOKEN_SAMALTMANN }}
          KAGGLE_ACCESS_TOKEN_SHOUMIKMITRA: ${{ secrets.KAGGLE_ACCESS_TOKEN_SHOUMIKMITRA }}
        run: |
          mkdir -p "$HOME/.kaggle/profiles/softmaxsimp" \
                   "$HOME/.kaggle/profiles/samaltmannnn" \
                   "$HOME/.kaggle/profiles/shoumikmitra"
          printf '%s' "$KAGGLE_ACCESS_TOKEN" > "$HOME/.kaggle/access_token"
          printf '%s' "$KAGGLE_JSON_VEDANGPANDEYY" > "$HOME/.kaggle/kaggle.json"
          printf '%s' "$KAGGLE_ACCESS_TOKEN_SOFTMAXSIMP" > "$HOME/.kaggle/profiles/softmaxsimp/access_token"
          printf '%s' "$KAGGLE_ACCESS_TOKEN_SAMALTMANN" > "$HOME/.kaggle/profiles/samaltmannnn/access_token"
          printf '%s' "$KAGGLE_ACCESS_TOKEN_SHOUMIKMITRA" > "$HOME/.kaggle/profiles/shoumikmitra/access_token"
          chmod 600 "$HOME/.kaggle/access_token" "$HOME/.kaggle/kaggle.json" \
                     "$HOME/.kaggle/profiles/softmaxsimp/access_token" \
                     "$HOME/.kaggle/profiles/samaltmannnn/access_token" \
                     "$HOME/.kaggle/profiles/shoumikmitra/access_token"
      - name: Pipeline keep-alive
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          MONITOR_URL: https://chess-slm-monitor.vedangpandeyy.workers.dev
          MONITOR_INGEST_KEY: ${{ secrets.MONITOR_INGEST_KEY }}
        run: |
          python3 scripts/ensure_build_2b.py || true
          python3 scripts/watch_1b.py || true
          python3 scripts/ensure_eval_320k.py || true
          python3 scripts/ensure_eval_preview.py || true
          python3 scripts/push_monitor.py
