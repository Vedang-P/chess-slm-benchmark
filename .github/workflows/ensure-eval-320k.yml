name: ensure-eval-320k

# Safety net for the automatic frozen evaluation of ccgavn-5m-seed0 at 320k.
# Runs every 30 minutes; if the checkpoint exists on HF and the eval kernel is
# not active and not already DONE, it pushes the eval kernel (which itself
# waits for the checkpoint and then runs the full MATE + 10K protocol).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ensure-eval-320k
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet "kaggle>=2,<3" huggingface_hub numpy
      - name: Write Kaggle credential
        env:
          KAGGLE_JSON_VEDANGPANDEYY: ${{ secrets.KAGGLE_JSON_VEDANGPANDEYY }}
        run: |
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_JSON_VEDANGPANDEYY" > "$HOME/.kaggle/kaggle.json"
          chmod 600 "$HOME/.kaggle/kaggle.json"
      - name: Ensure eval kernel
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
        run: python3 scripts/ensure_eval_320k.py
