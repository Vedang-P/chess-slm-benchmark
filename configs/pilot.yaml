# Representation pilot: which prompt representation do SLMs understand best?
# Runs BEFORE the full sweep; its winner becomes the full sweep's primary
# variant (top-2 go into the paper's ablation).
#
#   python scripts/run_suite.py --config configs/pilot.yaml --check   # sanity
#   python scripts/run_suite.py --config configs/pilot.yaml           # on Kaggle
#   python scripts/analyze_pilot.py                                   # verdict
models: [smollm2-1.7b, qwen2.5-3b]

tasks:
  cap-legal-8x8:  {file: cap-legal-8x8.json,  full_n: 30, check_n: 2, variants: [grid, fen, bitboard, list]}
  bestmove-8x8:   {file: bestmove-8x8.json,   full_n: 30, check_n: 2, variants: [grid, fen, bitboard, list]}
  mate1-lichess:  {file: mate1-lichess.json,  full_n: 30, check_n: 2, variants: [grid, fen, bitboard, list]}

check:
  models: [smollm2-1.7b]
  max_new_tokens: 256

full:
  max_new_tokens: 2048
  game_max_new_tokens: 1024
  smoke: false
  conditions: [win]
