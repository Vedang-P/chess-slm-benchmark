# The chess study suite: 3 models x representations x 3 core tasks.
#
# Incremental testing: check_n=1 (stack validation) -> mid_n (subset) ->
# full_n (paper data). Deepseek is ~2s/position (gateway), gemma is
# ~1-3 min/position on the T4, so per-cell n can differ by model tier.
models:
- gemma4-e2b
- gemma4-e4b
- deepseek-v4-flash
tasks:
  mate1-lichess:
    file: mate1-lichess.json
    full_n: 40
    check_n: 1
    variants:
    - grid
    - fen
    - bitboard
    - list
  mate2-lichess:
    file: mate2-lichess.json
    full_n: 40
    check_n: 1
    variants:
    - grid
    - fen
    - bitboard
    - list
  bestmove-8x8:
    file: bestmove-8x8.json
    full_n: 40
    check_n: 1
    variants:
    - grid
    - fen
    - bitboard
    - list
check:
  max_new_tokens: 4096
  conditions:
  - win
full:
  max_new_tokens: 4096
  smoke: false
  conditions:
  - win
