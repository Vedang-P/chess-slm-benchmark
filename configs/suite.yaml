# Sweep definition for the SLM chess capability benchmark.
# check mode = tiny n, one ungated model (fast bug-catching on Kaggle).
# full mode = the paper's data collection (WIN/capability conditions only).
models: [deepseek-r1-distill-qwen-1.5b, smollm2-1.7b, qwen2.5-1.5b, qwen2.5-3b, gemma4-e2b, gemma4-e4b]

tasks:
  # --- legality / rule understanding ---
  cap-legal-8x8:  {file: cap-legal-8x8.json,  full_n: 40, check_n: 3, variants: [grid, fen]}
  # --- tactics (real lichess puzzles, CC0) ---
  mate1-lichess:  {file: mate1-lichess.json,  full_n: 40, check_n: 3, variants: [grid, fen]}
  mate2-lichess:  {file: mate2-lichess.json,  full_n: 40, check_n: 3, variants: [grid, fen]}
  # --- move strength (Stockfish ground truth) ---
  bestmove-8x8:   {file: bestmove-8x8.json,   full_n: 40, check_n: 3, variants: [grid, fen]}
  # --- exact small-board endgames (retrograde values) ---
  sm-3x3-win:     {file: sm-3x3-win.json,     full_n: 40, check_n: 3, variants: [grid]}
  sm-5x5-win:     {file: sm-5x5-win.json,     full_n: 40, check_n: 3, variants: [grid]}
  sm-5x5-draw:    {file: sm-5x5-draw.json,    full_n: 40, check_n: 3, variants: [grid]}
  # --- full-game play (model vs random opponent) ---
  playout-5x5:    {game: true, full_n: 10, check_n: 2, variants: [grid]}
  ttt:            {game: true, full_n: 10, check_n: 2, variants: [grid]}
  c4:             {game: true, full_n: 10, check_n: 2, variants: [grid]}

check:
  models: [smollm2-1.7b]
  max_new_tokens: 256

full:
  max_new_tokens: 512
  smoke: false
  conditions: [win]  # capability-only; the LOSE machinery stays in the codebase

# per-model generation budgets: reasoning models emit long CoT — capping
# them cuts wall-clock time without hurting short chess answers.
model_max_tokens:
  deepseek-r1-distill-qwen-1.5b: 384
