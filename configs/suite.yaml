# full_n is the number of positions scored per task in a FULL sweep. It is
# NOT the committed task-set size (mate1 250, mate2 250, bestmove 120): raise
# it to score the whole set, and make sure anything reported as "n=250"
# actually ran at 250.
models:
- gemma4-e2b
- gemma4-e4b
- deepseek-v4-flash
tasks:
  mate1-lichess:
    file: mate1-lichess.json
    full_n: 40
    check_n: 1
    variants:
    - fen
  mate2-lichess:
    file: mate2-lichess.json
    full_n: 40
    check_n: 1
    variants:
    - fen
  bestmove-8x8:
    file: bestmove-8x8.json
    full_n: 40
    check_n: 1
    variants:
    - fen
check:
  max_new_tokens: 2048
  conditions:
  - win
full:
  max_new_tokens: 2048
  smoke: false
  conditions:
  - win
