# Model registry for the anti-goal benchmark.
# All models load via hf_models.HFModel (4-bit bitsandbytes on the Kaggle T4).
models:
  - id: deepseek-r1-distill-qwen-1.5b
    hf: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    gated: false
    note: R1-style reasoning model, 1.5B
  - id: smollm2-1.7b
    hf: HuggingFaceTB/SmolLM2-1.7B-Instruct
    gated: false
    note: base-line instruct model, fast on T4
  - id: qwen2.5-1.5b
    hf: Qwen/Qwen2.5-1.5B-Instruct
    gated: false
  - id: qwen2.5-3b
    hf: Qwen/Qwen2.5-3B-Instruct
    gated: false
  - id: gemma4-e2b
    hf: google/gemma-4-E2B-it
    gated: true
    note: requires HF_TOKEN (Kaggle secret)
  - id: gemma4-e4b
    hf: google/gemma-4-E4B-it
    gated: true
    note: requires HF_TOKEN; heavier on T4
