# Model registry for the SLM x frontier chess study (2026).
#
# gemma4-e2b / gemma4-e4b: local 4-bit HF inference on the Kaggle T4
#   (requires HF_TOKEN secret for the gated checkpoints).
# deepseek-v4-flash: opencode-go gateway API (OpenAI-compatible).
#   Requires OPENCODE_API_KEY secret. Thinking disabled in the client
#   (it otherwise burns the whole budget on reasoning and returns
#   empty content). Cheap + fast (~2s/position), so it runs the full
#   representation matrix.
models:
  - id: gemma4-e2b
    hf: google/gemma-4-E2B-it
    gated: true
    note: requires HF_TOKEN (Kaggle secret)
  - id: gemma4-e4b
    hf: google/gemma-4-E4B-it
    gated: true
    note: requires HF_TOKEN; heavier on T4
  - id: deepseek-v4-flash
    api: opencode-go
    note: gateway backend, OPENCODE_API_KEY secret, thinking disabled
